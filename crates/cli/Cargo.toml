[package]
name = "chatjimmy-cli"
version = "0.1.0"
edition = "2021"
description = "Command-line client for the chatjimmy.ai API"
license = "MIT"

[[bin]]
name = "chatjimmy"
path = "src/main.rs"

[dependencies]
chatjimmy = { version = "0.1.0", path = "../core" }
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-util", "io-std"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }
wiremock = "0.6.5"
