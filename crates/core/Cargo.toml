[package]
name = "chatjimmy"
version = "0.1.0"
edition = "2021"
description = "Unofficial async client for the chatjimmy.ai API (Taalas HC1 inference)"
license = "MIT"

[dependencies]
bytes = "1.12.1"
fastrand = "2.5.0"
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }

[dev-dependencies]
criterion = "0.8.2"
tokio = { version = "1.54.1", features = ["full"] }
wiremock = "0.6.5"

[[bench]]
name = "overhead"
harness = false
